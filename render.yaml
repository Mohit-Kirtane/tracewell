services:
  - type: web
    name: tracewell-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tracewell
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_KEY_FALLBACK
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_WORKER_INLINE
        value: "true"
